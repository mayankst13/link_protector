<!DOCTYPE html>
<html>
<head>
  <title>Secure Access</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a, #020617);
      color: white;
      overflow: hidden;
    }

    /* animated background glow */
    body::before {
      content: "";
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(34,197,94,0.25), transparent 70%);
      animation: floatGlow 8s infinite alternate ease-in-out;
    }

    @keyframes floatGlow {
      from { transform: translate(-100px,-100px); }
      to { transform: translate(100px,100px); }
    }

    .card {
      position: relative;
      width: 420px;
      max-width: 95%;
      padding: 40px;
      border-radius: 20px;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 0 60px rgba(34,197,94,0.08);
      text-align: center;
      z-index: 2;
    }

    .icon {
      font-size: 55px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .sub {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 30px;
    }

    .progress {
      text-align: left;
      margin-top: 10px;
    }

    .step {
      display: flex;
      align-items: center;
      margin: 16px 0;
      opacity: 0.4;
      transition: 0.4s ease;
    }

    .step.active {
      opacity: 1;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 12px;
      background: #334155;
      transition: 0.4s ease;
    }

    .dot.green {
      background: #22c55e;
      box-shadow: 0 0 10px #22c55e;
    }

    .spinner {
      margin: 20px auto;
      width: 30px;
      height: 30px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top: 3px solid #22c55e;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    button {
      margin-top: 30px;
      padding: 12px 30px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(90deg, #22c55e, #16a34a);
      font-weight: 600;
      cursor: pointer;
      display: none;
      transition: 0.3s ease;
      width: 100%;
      color: black;
      font-size: 15px;
    }

    button:hover {
      transform: scale(1.03);
      box-shadow: 0 0 15px rgba(34,197,94,0.5);
    }

    .footer {
      margin-top: 25px;
      font-size: 12px;
      color: #64748b;
    }

    @media (max-width: 480px) {
      .card {
        padding: 30px;
      }
    }
  </style>
</head>

<body>

<div class="card">

  <div class="icon">🔒</div>

  <h1>Securing Your Session</h1>
  <div class="sub">Performing automated security checks</div>

  <div class="spinner" id="spinner"></div>

  <div class="progress">
    <div class="step active" id="step1">
      <div class="dot" id="dot1"></div>
      Checking link integrity
    </div>
    <div class="step" id="step2">
      <div class="dot" id="dot2"></div>
      Validating secure handshake
    </div>
    <div class="step" id="step3">
      <div class="dot" id="dot3"></div>
      Encrypting redirect path
    </div>
    <div class="step" id="step4">
      <div class="dot" id="dot4"></div>
      Preparing secure transfer
    </div>
  </div>

  <button id="continueBtn">Continue Securely</button>

  <div class="footer">
    Secure Access Gateway • 256-bit Encrypted
  </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const steps = [
    { step: "step1", dot: "dot1" },
    { step: "step2", dot: "dot2" },
    { step: "step3", dot: "dot3" },
    { step: "step4", dot: "dot4" }
  ];

  const btn = document.getElementById("continueBtn");
  let current = 0;

  function nextStep() {

    if (current > 0) {
      document.getElementById(steps[current - 1].dot)
        .classList.add("green");
    }

    if (current < steps.length) {
      document.getElementById(steps[current].step)
        .classList.add("active");
      current++;
      setTimeout(nextStep, 900);
    } else {
      document.getElementById("spinner").style.display = "none";
      btn.style.display = "block";
    }
  }

  setTimeout(nextStep, 800);

  btn.onclick = () => {
    const token = window.location.pathname.split("/").pop();
    window.location.href = "/api/go?token=" + token;
  };

});
</script>

</body>
</html>
