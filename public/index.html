<!DOCTYPE html>
<html>
<head>
  <title>Create Protected Link</title>
</head>
<body style="text-align:center;margin-top:100px;">

<h1>Create Protected Link</h1>

<input id="linkInput" placeholder="Paste your link" style="width:300px;" />
<br><br>
<button onclick="generate()">Generate</button>

<p id="result"></p>

<script>
async function generate() {

  const url = document.getElementById("linkInput").value;

  const res = await fetch("/api/create", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ url })
  });

  const data = await res.json();

  document.getElementById("result").innerHTML =
    `<a href="/l/${data.link.split('/l/')[1]}" target="_blank">
      ${location.origin}/l/${data.link.split('/l/')[1]}
    </a>`;
}
</script>

</body>
</html>
